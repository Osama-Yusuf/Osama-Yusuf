<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" width="900" height="288" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
      <animate attributeName="x1" values="-1;0;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="c1"><rect x="30" y="56" width="0" height="30">
      <animate attributeName="width" from="0" to="110" dur="0.5s" begin="0.2s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="c2"><rect x="30" y="92" width="0" height="52">
      <animate attributeName="width" from="0" to="330" dur="0.7s" begin="0.9s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="c3"><rect x="30" y="152" width="0" height="28">
      <animate attributeName="width" from="0" to="190" dur="0.6s" begin="1.8s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="c4"><rect x="30" y="182" width="0" height="60">
      <animate attributeName="width" from="0" to="520" dur="1s" begin="2.5s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="286" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="34" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="34" r="6" fill="#FFBD2E"/>
  <circle cx="74" cy="34" r="6" fill="#27C93F"/>
  <text x="450" y="39" fill="#6E7681" font-size="13" text-anchor="middle">osama@labs — zsh</text>
  <line x1="1" y1="52" x2="899" y2="52" stroke="#21262D" stroke-width="1"/>

  <!-- $ whoami -->
  <g clip-path="url(#c1)">
    <text x="30" y="78" font-size="17">
      <tspan fill="#27C93F">$</tspan><tspan fill="#8B949E"> whoami</tspan>
    </text>
  </g>

  <!-- name -->
  <g clip-path="url(#c2)">
    <text x="30" y="130" font-size="42" font-weight="700" fill="url(#name)">Osama Yusuf</text>
  </g>

  <!-- $ cat about.txt -->
  <g clip-path="url(#c3)">
    <text x="30" y="172" font-size="17">
      <tspan fill="#27C93F">$</tspan><tspan fill="#8B949E"> cat about.txt</tspan>
    </text>
  </g>

  <!-- about lines -->
  <g clip-path="url(#c4)">
    <text x="30" y="204" font-size="15" fill="#C9D1D9">DevSecOps &amp; Platform Engineer @ Easygenerator · ex-IBM</text>
    <text x="30" y="230" font-size="15" fill="#8B949E">uptime by day · side quests by night</text>
  </g>

  <!-- final prompt -->
  <text x="30" y="270" font-size="17" fill="#27C93F" opacity="0">$
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.6s" fill="freeze"/>
  </text>
  <rect x="50" y="267" width="11" height="3" fill="#06B6D4" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="0.1s" begin="3.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="3.7s" repeatCount="indefinite"/>
  </rect>

</svg>